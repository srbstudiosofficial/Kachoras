<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <!-- Brushed Champagne Gold Gradients -->
    <linearGradient id="facetHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="45%" stop-color="#E5C368" />
      <stop offset="100%" stop-color="#C59B27" />
    </linearGradient>

    <linearGradient id="facetMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECC666" />
      <stop offset="50%" stop-color="#B88A1E" />
      <stop offset="100%" stop-color="#7A580E" />
    </linearGradient>

    <linearGradient id="facetShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8F6813" />
      <stop offset="50%" stop-color="#593E07" />
      <stop offset="100%" stop-color="#362402" />
    </linearGradient>

    <linearGradient id="rimGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0BE" />
      <stop offset="50%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#8C6514" />
    </linearGradient>

    <!-- Shield Background Gradient -->
    <radialGradient id="crestBackground" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#541B0B" />
      <stop offset="55%" stop-color="#2B0D05" />
      <stop offset="100%" stop-color="#14171F" />
    </radialGradient>
  </defs>

  <!-- Group: Insignia Crest (Left, 0-110) -->
  <g transform="translate(10, 10)">
    <!-- Base Crest Container (100x100) -->
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#crestBackground)" stroke="url(#rimGold)" stroke-width="2" />
    
    <!-- Precision Inset Blueprint Grid -->
    <rect x="6" y="6" width="88" height="88" rx="19" fill="none" stroke="#E5C368" stroke-width="0.75" stroke-dasharray="3 2" opacity="0.35" />

    <!-- MONOGRAM: Faceted Architectural "K" -->
    <!-- 1. Left Vertical Column (Faceted into 4 reflective planes with central ridge) -->
    <!-- Left Face Upper -->
    <polygon points="24,20 34,16 34,50 24,50" fill="url(#facetHighlight)" />
    <!-- Right Face Upper -->
    <polygon points="34,16 44,20 44,50 34,50" fill="url(#facetMid)" />
    <!-- Left Face Lower -->
    <polygon points="24,50 34,50 34,84 24,80" fill="url(#facetMid)" />
    <!-- Right Face Lower -->
    <polygon points="34,50 44,50 44,80 34,84" fill="url(#facetShadow)" />

    <!-- 2. Upper Diagonal Cantilever Arm -->
    <!-- Upper Facet Plane (Catches primary ambient light) -->
    <polygon points="44,44 60,30 76,16 78,24 50,52" fill="url(#facetHighlight)" />
    <!-- Lower Facet Plane (Shadow undercut) -->
    <polygon points="50,52 78,24 82,32 54,58" fill="url(#facetShadow)" />
    <!-- End Cap Miter -->
    <polygon points="76,16 82,32 78,24" fill="url(#facetMid)" />

    <!-- 3. Lower Diagonal Strut -->
    <!-- Upper Facet Plane -->
    <polygon points="44,54 52,48 80,76 72,84" fill="url(#facetMid)" />
    <!-- Lower Facet Plane -->
    <polygon points="44,54 72,84 62,84 38,58" fill="url(#facetShadow)" />

    <!-- 4. Central Keystone Nexus (Locking Diamond) -->
    <polygon points="38,50 46,42 54,50 46,58" fill="url(#facetHighlight)" stroke="#FFF5D6" stroke-width="0.5" />

    <!-- Architectural Bevel Edges (Polished 3D Brass Rim) -->
    <polyline points="24,20 34,16 44,20" fill="none" stroke="url(#rimGold)" stroke-width="1.2" />
    <polyline points="24,80 34,84 44,80" fill="none" stroke="url(#rimGold)" stroke-width="1.2" />
    <line x1="24" y1="20" x2="24" y2="80" stroke="url(#rimGold)" stroke-width="1.2" />
    <line x1="44" y1="20" x2="44" y2="80" stroke="url(#rimGold)" stroke-width="1.2" />
    <line x1="34" y1="16" x2="34" y2="84" stroke="#FFF5D6" stroke-width="1" opacity="0.6" />

    <!-- Alignment Micro-Dots -->
    <circle cx="17" cy="17" r="1.5" fill="#E5C368" opacity="0.5" />
    <circle cx="83" cy="83" r="1.5" fill="#E5C368" opacity="0.5" />
  </g>

  <!-- Group: Brand Typography (Right, x=130) -->
  <g transform="translate(130, 20)">
    <!-- Primary Brand Wordmark: KACHORAS -->
    <text x="0" y="44" font-family="'Cinzel', 'Outfit', Georgia, serif" font-size="40" font-weight="700" letter-spacing="6" fill="#14171F">
      KACHORAS
    </text>

    <!-- License Badge: G+1 -->
    <rect x="330" y="18" width="46" height="24" rx="6" fill="#C59B27" fill-opacity="0.12" stroke="#C59B27" stroke-width="1" />
    <text x="353" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#7A2E16" text-anchor="middle">
      G+1
    </text>

    <!-- Engineering Discipline Descriptor -->
    <text x="2" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" letter-spacing="2.5" fill="#7A2E16">
      ELECTROMECHANICAL CONTRACTING L.L.C.
    </text>

    <!-- Subtitle Strip: Arabic Legal Translation & Heritage -->
    <text x="2" y="88" font-family="Arial, 'Traditional Arabic', sans-serif" font-size="13" font-weight="600" letter-spacing="0.5" fill="#5A6578">
      كاشوراس للمقاولات الكهروميكانيكية ش.ذ.م.م • دبي، تأسست ٢٠٠٦
    </text>
  </g>
</svg>
